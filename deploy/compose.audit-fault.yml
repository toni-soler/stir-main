# AUDIT FAULT INJECTION TOPOLOGY - only for scripts/audit_economic_commit_e2e.py, never part of the release.
# The ordinary STIR runtime is pointed at the fault proxy for the duration of that check; the proxy forwards to the
# real osTRIS container and injects 503/timeout responses on command. Apply with:
#   docker compose -p <isolated-project> -f compose.yml -f compose.release.yml -f deploy/compose.audit-fault.yml \
#     up -d --no-deps audit-fault-proxy stir
# and restore the release topology afterwards with the base files only:
#   docker compose -p <isolated-project> -f compose.yml -f compose.release.yml up -d --no-deps stir
services:
  audit-fault-proxy:
    image: python:3.12-alpine
    command: ["python3", "/proxy/audit_ostris_fault_proxy.py"]
    environment:
      OSTRIS_UPSTREAM: http://ostris:8095
    volumes:
      - ./scripts/audit_ostris_fault_proxy.py:/proxy/audit_ostris_fault_proxy.py:ro
    ports:
      - "127.0.0.1:18095:8095"
    networks: [edge, data]
  stir:
    environment:
      OSTRIS_BASE_URL: http://audit-fault-proxy:8095
